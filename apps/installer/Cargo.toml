[package]
name = "nyx-installer"
description = "Nyx Installer: installs NyxOS from the live USB"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-install = { path = "../../crates/nyx-install" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "8e723ee" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
async-channel = "2"
anyhow.workspace = true
