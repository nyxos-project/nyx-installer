[package]
name = "nyx-installer"
description = "Nyx Installer: installs NyxOS from the live USB"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-install = { path = "../../crates/nyx-install" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "8e723ee" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "394ddf8193797cd1f420fac98b097d04fa75f0e2" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d2398b346b6bc414cc031b0a08a1b2a9a0f6ee2e" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d2398b346b6bc414cc031b0a08a1b2a9a0f6ee2e" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
async-channel = "2"
anyhow.workspace = true
